name: Build Release APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore
        id: keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PW" ] && [ -n "$SECRET_KEY_PW" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "STORE_PASSWORD=$SECRET_STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PW" >> "$GITHUB_ENV"
          else
            CI_PASS="bummm_ci_release_key"
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=BUMMM, OU=Mobile, O=BUMMM, L=App, ST=App, C=US"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename Release APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/bummm-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bummm-release-apk
          path: release-output/bummm-release.apk
          retention-days: 90

      - name: Publish Downloadable GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('BUMMM! {0}', github.ref_name) || 'BUMMM! Latest Release APK' }}
          body: |
            Automated signed release build for **BUMMM!**.
            Download `bummm-release.apk` below to install on Android.
          files: release-output/bummm-release.apk
          prerelease: false
          make_latest: true
